<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Màu chủ đạo — demo 21/11</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #14161b; color: #eef0f5; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding: 10px 16px; background: #0d0f13; border-bottom: 1px solid #2c303b; font-size: 14px; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .group > span { color: #a9afbf; margin-right: 4px; }
  .bar button { min-height: 36px; padding: 0 12px; border: 1px solid #3c4252; background: #1b1e25; color: #eef0f5; font: inherit; cursor: pointer; }
  .bar button[aria-pressed="true"] { background: #3549bb; border-color: #3549bb; color: #fff; }
  .bar button:focus-visible { outline: 2px solid #aab8ff; outline-offset: 2px; }
  .note { width: 100%; color: #a9afbf; margin: 0; line-height: 1.5; }
  .stage { display: grid; place-items: start center; padding: 16px; }
  iframe { width: min(1440px, 100%); height: calc(100vh - 150px); min-height: 640px; border: 1px solid #2c303b; background: #fff; }
</style>
<script src="../shared/speech.js?v=b35997846e94"></script>
<link rel="stylesheet" href="../shared/mascot.css?v=a0a60f61b067">
<script src="../shared/theme.js?v=c94fd5ea622d"></script>
</head>
<body>
<div class="bar">
  <div class="group" data-group="page"><span>Màn</span>
    <button type="button" data-v="../dot2/hom-nay.html" aria-pressed="true">Hôm nay</button>
    <button type="button" data-v="../dot1/bo-the.html">Bộ thẻ</button>
    <button type="button" data-v="../dot1/thu-vien.html">Thư viện</button>
    <button type="button" data-v="../dot2/luyen-tap.html">Luyện tập</button>
    <button type="button" data-v="../dot2/thong-ke.html">Thống kê</button>
  </div>
  <div class="group" data-group="layer"><span>Bản</span>
    <button type="button" data-v="cu">Hiện tại</button>
    <button type="button" data-v="moi" aria-pressed="true">Đề xuất</button>
  </div>
  <div class="group" data-group="theme"><span>Giao diện</span>
    <button type="button" data-v="light" aria-pressed="true">Sáng</button>
    <button type="button" data-v="dark">Tối</button>
  </div>
  <p class="note">Đề xuất: thanh bên indigo đậm là vùng màu chủ đạo, nội dung giữ nền giấy; bỏ dòng chữ nhỏ trên tiêu đề, bỏ câu chào thường trực của Mực (vẫn nói khi lưu xong/lỗi), panel phẳng không viền không bóng. Chỉ chèn vào khung xem trước, CSS chung chưa sửa.</p>
</div>
<div class="stage"><iframe id="frame" title="Màn hình xem trước"></iframe></div>

<template id="layer">
<style id="brand-layer">
:root[data-layer="moi"] .nav-link[href*="hom-nay"], :root[data-layer="moi"] .nav-link[href*="thanh-tich"], :root[data-layer="moi"] .nav-link[href*="tong-ket"] { --hue-on-brand: var(--accent); }
:root[data-layer="moi"] .nav-link[href*="bo-the"] { --hue-on-brand: var(--on-primary-soft); }
:root[data-layer="moi"] .nav-link[href*="thu-vien"], :root[data-layer="moi"] .nav-link[href*="ai-"], :root[data-layer="moi"] .nav-link[href*="goi-y"], :root[data-layer="moi"] .nav-link[href*="phat-am"] { --hue-on-brand: #7fd6cf; }
:root[data-layer="moi"] .nav-link[href*="luyen-tap"] { --hue-on-brand: #a9c9ff; }
:root[data-layer="moi"] .nav-link[href*="so-tay"] { --hue-on-brand: #ffa3a8; }
:root[data-layer="moi"] .nav-link[href*="thong-ke"] { --hue-on-brand: #82dcae; }

@media (min-width: 1024px) {
  :root[data-layer="moi"] .app-header { background: linear-gradient(to right, var(--brand-surface) 0 var(--sidebar-w), var(--sheet) var(--sidebar-w)); box-shadow: inset 0 -1px 0 var(--line); }
  :root[data-layer="moi"] .app-header .brand { color: var(--on-primary); }
  :root[data-layer="moi"] .app-header .brand-accent { color: var(--accent); }
  :root[data-layer="moi"] .sidebar { background: var(--brand-surface); border-right: 0; color: var(--on-primary); scrollbar-color: rgb(255 255 255 / .28) transparent; }
  :root[data-layer="moi"] .sidebar .nav-group-title, :root[data-layer="moi"] .sidebar .nav-group-title * { color: var(--on-primary-soft); }
  :root[data-layer="moi"] .sidebar .nav-link { color: rgb(255 255 255 / .86); }
  :root[data-layer="moi"] .sidebar .nav-link:hover { background: rgb(255 255 255 / .08); color: var(--on-primary); }
  :root[data-layer="moi"] .sidebar .nav-link[aria-current="page"] { background: rgb(255 255 255 / .14); color: var(--on-primary); box-shadow: none; font-weight: 700; }
  :root[data-layer="moi"] .sidebar .nav-link .icon, :root[data-layer="moi"] .sidebar .nav-link[aria-current="page"] .icon { color: var(--hue-on-brand, var(--on-primary-soft)); background: none; }
  :root[data-layer="moi"] .sidebar .nav-link:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
}

:root[data-layer="moi"] .form-code { display: none; }
:root[data-layer="moi"] .muc-companion:not([data-muc-state="success"]):not([data-muc-state="error"]):not([data-muc-state="speaking"]):not([data-muc-state="thinking"]) .muc-bubble { display: none; }
:root[data-layer="moi"] .panel { border-color: transparent; box-shadow: none; }
:root[data-layer="moi"] ::selection { background: var(--primary-tint-2); color: var(--ink); }
</style>
</template>

<script>
  const frame = document.getElementById('frame');
  const state = { page: '../dot2/hom-nay.html', layer: 'moi', theme: 'light' };
  try { localStorage.setItem('vl-demo-session', JSON.stringify({ userId: '2' })); } catch {}

  function apply() {
    const doc = frame.contentDocument;
    if (!doc || !doc.documentElement) return;
    const root = doc.documentElement;
    root.dataset.theme = state.theme;
    root.dataset.layer = state.layer;
    if (!doc.getElementById('brand-layer')) {
      doc.head.appendChild(document.getElementById('layer').content.firstElementChild.cloneNode(true));
    }
  }

  frame.addEventListener('load', () => {
    apply();
    new MutationObserver(() => {
      const r = frame.contentDocument.documentElement;
      if (r.dataset.theme !== state.theme) r.dataset.theme = state.theme;
    }).observe(frame.contentDocument.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  });

  document.querySelectorAll('.group').forEach((g) => {
    g.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      g.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      state[g.dataset.group] = b.dataset.v;
      if (g.dataset.group === 'page') frame.src = state.page; else apply();
    });
  });

  frame.src = state.page;
</script>
<script src="../shared/mascot.js?v=f38c732c1a4f"></script>
<script src="../shared/fx.js?v=e79749d07a95"></script>
</body>
</html>
