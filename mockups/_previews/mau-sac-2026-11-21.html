<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mức màu — demo 21/11</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #1d2027; color: #eef0f5; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 10px 16px; background: #111318; border-bottom: 1px solid #333846; font-size: 14px; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .group > span { color: #a9afbf; margin-right: 4px; }
  .bar button { min-height: 36px; padding: 0 12px; border: 1px solid #3c4252; background: #1d2027; color: #eef0f5; font: inherit; cursor: pointer; }
  .bar button[aria-pressed="true"] { background: #4b5fd6; border-color: #4b5fd6; color: #fff; }
  .bar button:focus-visible { outline: 2px solid #9fb0ff; outline-offset: 2px; }
  .note { width: 100%; color: #a9afbf; margin: 0; }
  .stage { display: grid; place-items: start center; padding: 16px; }
  iframe { width: min(1280px, 100%); height: calc(100vh - 140px); min-height: 640px; border: 1px solid #333846; background: #fff; }
</style>
<script src="../shared/speech.js?v=b35997846e94"></script>
<link rel="stylesheet" href="../shared/mascot.css?v=a0a60f61b067">
<script src="../shared/theme.js?v=c94fd5ea622d"></script>
</head>
<body>
<div class="bar">
  <div class="group" data-group="page"><span>Màn</span>
    <button type="button" data-v="../dot2/hom-nay.html" aria-pressed="true">Hôm nay</button>
    <button type="button" data-v="../dot1/thu-vien.html">Thư viện</button>
    <button type="button" data-v="../dot1/bo-the.html">Bộ thẻ</button>
    <button type="button" data-v="../dot2/thong-ke.html">Thống kê</button>
  </div>
  <div class="group" data-group="level"><span>Mức màu</span>
    <button type="button" data-v="hien-tai">Hiện tại</button>
    <button type="button" data-v="vua" aria-pressed="true">Vừa</button>
    <button type="button" data-v="dam">Đậm</button>
  </div>
  <div class="group" data-group="theme"><span>Giao diện</span>
    <button type="button" data-v="light" aria-pressed="true">Sáng</button>
    <button type="button" data-v="dark">Tối</button>
  </div>
  <p class="note">Lớp màu chỉ chèn vào khung xem trước, chưa sửa CSS chung. Dùng lại token có sẵn (indigo, vàng học, xanh lá, xanh ngọc media, xanh sửa, đỏ yêu thích) nên sáng/tối tự đổi.</p>
</div>
<div class="stage"><iframe id="frame" title="Màn hình xem trước"></iframe></div>

<template id="layer">
<style id="color-layer">
:root[data-color] .nav-link[href*="hom-nay"] { --hue: var(--warning); }
:root[data-color] .nav-link[href*="bo-the"] { --hue: var(--primary); }
:root[data-color] .nav-link[href*="thu-vien"] { --hue: var(--media-ink); }
:root[data-color] .nav-link[href*="luyen-tap"] { --hue: var(--edit); }
:root[data-color] .nav-link[href*="so-tay"] { --hue: var(--favorite); }
:root[data-color] .nav-link[href*="thong-ke"] { --hue: var(--secondary); }
:root[data-color] .nav-link[href*="thanh-tich"], :root[data-color] .nav-link[href*="tong-ket"] { --hue: var(--warning); }
:root[data-color] .nav-link[href*="ai-"], :root[data-color] .nav-link[href*="goi-y"], :root[data-color] .nav-link[href*="phat-am"] { --hue: var(--media-ink); }

:root[data-color] .nav-link .icon { color: var(--hue, var(--ink-2)); }
:root[data-color] .nav-link[aria-current="page"] { background: color-mix(in srgb, var(--hue, var(--primary)) 14%, transparent); color: var(--ink); box-shadow: inset 3px 0 0 var(--hue, var(--primary)); }
:root[data-color] .form-code > span:first-child { color: var(--primary); font-weight: 700; }
:root[data-color] .app-header { box-shadow: inset 0 -3px 0 var(--primary); }

:root[data-color] .tally > div { --tone: var(--primary); box-shadow: inset 0 3px 0 var(--tone); }
:root[data-color] .tally > div:nth-child(1) { --tone: var(--warning); }
:root[data-color] .tally > div:nth-child(2) { --tone: var(--primary); }
:root[data-color] .tally > div:nth-child(3) { --tone: var(--secondary); }
:root[data-color] .tally > div:nth-child(4) { --tone: var(--media-ink); }
:root[data-color] .tally .tally-n { color: var(--tone); }

:root[data-color] .side-col > .panel, :root[data-color] aside > .panel { --tone: var(--primary); border-top: 3px solid var(--tone); }
:root[data-color] .side-col > .panel:nth-of-type(4n+1), :root[data-color] aside > .panel:nth-of-type(4n+1) { --tone: var(--warning); }
:root[data-color] .side-col > .panel:nth-of-type(4n+2), :root[data-color] aside > .panel:nth-of-type(4n+2) { --tone: var(--primary); }
:root[data-color] .side-col > .panel:nth-of-type(4n+3), :root[data-color] aside > .panel:nth-of-type(4n+3) { --tone: var(--secondary); }
:root[data-color] .side-col > .panel:nth-of-type(4n+4), :root[data-color] aside > .panel:nth-of-type(4n+4) { --tone: var(--media-ink); }
:root[data-color] .panel-title { color: var(--tone, var(--ink)); }

:root[data-color] .answer-no { color: var(--primary); font-weight: 700; }
:root[data-color] .fieldset > legend::first-letter { color: var(--primary); }
:root[data-color] .choice-card:has(input:checked) { box-shadow: inset 0 0 0 1px var(--primary), inset 4px 0 0 var(--primary); }

:root[data-color="dam"] { --desk: color-mix(in srgb, var(--primary) 10%, var(--sunk)); }
:root[data-color="dam"] .app-header { background: var(--primary-fill); color: var(--on-primary); box-shadow: none; }
:root[data-color="dam"] .app-header .brand, :root[data-color="dam"] .app-header > * > .btn, :root[data-color="dam"] .app-header .header-actions > .btn, :root[data-color="dam"] .app-header .header-actions > .btn .icon { color: var(--on-primary); }
:root[data-color="dam"] .app-header .user-chip, :root[data-color="dam"] .app-header .theme-picker { color: var(--ink); }
:root[data-color="dam"] .app-header .brand-accent { color: var(--accent); }
:root[data-color="dam"] .nav-link .icon { background: color-mix(in srgb, var(--hue, var(--ink-2)) 16%, transparent); padding: 3px; box-sizing: content-box; border-radius: var(--radius-sm, 6px); }
:root[data-color="dam"] .tally > div { background: color-mix(in srgb, var(--tone) 9%, transparent); }
:root[data-color="dam"] .sheet { box-shadow: inset 0 4px 0 var(--primary); }
:root[data-color="dam"] .panel { background: color-mix(in srgb, var(--tone, var(--primary)) 6%, var(--field)); }
:root[data-color="dam"] .answer-no { background: var(--primary-tint); border-radius: 999px; min-width: 1.75rem; height: 1.75rem; display: inline-grid; place-items: center; }
:root[data-color="dam"] h1 { color: var(--primary-strong); }
:root[data-theme="dark"][data-color="dam"] h1 { color: var(--ink); }
</style>
</template>

<script>
  const frame = document.getElementById('frame');
  const state = { page: '../dot2/hom-nay.html', level: 'vua', theme: 'light' };
  try { localStorage.setItem('vl-demo-session', JSON.stringify({ userId: '2' })); } catch {}

  function apply() {
    const doc = frame.contentDocument;
    if (!doc || !doc.documentElement) return;
    const root = doc.documentElement;
    root.dataset.theme = state.theme;
    if (state.level === 'hien-tai') root.removeAttribute('data-color'); else root.dataset.color = state.level;
    if (!doc.getElementById('color-layer')) {
      doc.head.appendChild(document.getElementById('layer').content.firstElementChild.cloneNode(true));
    }
  }

  frame.addEventListener('load', () => {
    apply();
    new MutationObserver(() => {
      const r = frame.contentDocument.documentElement;
      if (r.dataset.theme !== state.theme) r.dataset.theme = state.theme;
    }).observe(frame.contentDocument.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  });

  document.querySelectorAll('.group').forEach((g) => {
    g.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      g.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      state[g.dataset.group] = b.dataset.v;
      if (g.dataset.group === 'page') frame.src = state.page; else apply();
    });
  });

  frame.src = state.page;
</script>
<script src="../shared/mascot.js?v=f38c732c1a4f"></script>
<script src="../shared/fx.js?v=e79749d07a95"></script>
</body>
</html>
