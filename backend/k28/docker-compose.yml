name: vocab

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-vocab_learn}
      MYSQL_USER: ${DB_USER:-vocab}
      MYSQL_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-123456}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["${DB_PORT:-3307}:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-s3admin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-s3admin_dev_pw}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: [s3-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      retries: 20

  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      s3: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-s3admin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-s3admin_dev_pw}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    volumes: ["./docker/s3-cors.json:/config/s3-cors.json:ro"]
    command: ["(aws --endpoint-url http://s3:9000 s3api head-bucket --bucket ${S3_BUCKET:-vocab-files} 2>/dev/null || aws --endpoint-url http://s3:9000 s3 mb s3://${S3_BUCKET:-vocab-files}) && aws --endpoint-url http://s3:9000 s3api put-bucket-cors --bucket ${S3_BUCKET:-vocab-files} --cors-configuration file:///config/s3-cors.json"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  api:
    profiles: ["app"]
    build: .
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-vocab_learn}
      DB_USER: ${DB_USER:-vocab}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-s3admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-s3admin_dev_pw}
      S3_BUCKET: ${S3_BUCKET:-vocab-files}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dev-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dev-google-client-secret}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/auth/google/callback}
    ports: ["${API_PORT:-8080}:8080"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
      mailpit: { condition: service_started }

volumes:
  mysql-data:
  redis-data:
  s3-data:
