name: vocab

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-vocab_learn}
      MYSQL_USER: ${DB_USER:-vocab}
      MYSQL_PASSWORD: ${DB_PASSWORD:?copy .env.example to .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?copy .env.example to .env}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["127.0.0.1:${DB_PORT:-3307}:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  s3:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?copy .env.example to .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?copy .env.example to .env}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [s3-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      retries: 20

  s3-init:
    image: amazon/aws-cli:2.38.5
    depends_on:
      s3: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-vocab-files}
      S3_CORS_ORIGINS: ${S3_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3100,http://127.0.0.1:3100}
    entrypoint: ["/bin/sh", "/config/s3-init.sh"]
    volumes: ["./docker/s3-init.sh:/config/s3-init.sh:ro"]

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  api:
    profiles: ["app"]
    build: .
    restart: on-failure
    env_file: [.env]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      S3_ENDPOINT: http://s3:9000
    ports: ["${API_PORT:-8080}:8080"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
      mailpit: { condition: service_started }

volumes:
  mysql-data:
  redis-data:
  s3-data:
