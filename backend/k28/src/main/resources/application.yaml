spring:
  application:
    name: k28
  profiles:
    default: dev
  flyway:
    locations: classpath:db/migration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:vocab_learn}?characterEncoding=UTF-8&connectionTimeZone=UTC
    username: ${DB_USER:vocab}
    password: ${DB_PASSWORD:123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  mail:
    host: ${MAIL_HOST:localhost}
    port: 1025


app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  cookie-secure: ${COOKIE_SECURE:false}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:s3admin}
    secret-key: ${S3_SECRET_KEY:s3admin_dev_pw}
    bucket: ${S3_BUCKET:vocab-files}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
server:
  servlet:
    session:
      timeout: 7d
