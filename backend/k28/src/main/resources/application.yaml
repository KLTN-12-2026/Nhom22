spring:
  application:
    name: k28
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/k28/.env[.properties]
  profiles:
    default: dev
  flyway:
    locations: classpath:db/migration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:vocab_learn}?characterEncoding=UTF-8&connectionTimeZone=UTC
    username: ${DB_USER:vocab}
    password: ${DB_PASSWORD:123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  session:
    data:
      redis:
        repository-type: indexed
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    default-encoding: UTF-8
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dev-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
            scope: openid,profile,email
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/api/v1/auth/{registrationId}/callback}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  cookie-secure: ${COOKIE_SECURE:false}
  mail:
    from: ${MAIL_FROM:VocabLearning <no-reply@vocab.local>}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:s3admin}
    secret-key: ${S3_SECRET_KEY:s3admin_dev_pw}
    bucket: ${S3_BUCKET:vocab-files}
    region: ${S3_REGION:us-east-1}
    presign-ttl: ${S3_PRESIGN_TTL:10m}

springdoc:
  default-produces-media-type: application/json
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    urls-primary-name: all
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    csrf:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  servlet:
    session:
      timeout: 7d
  tomcat:
    use-relative-redirects: true
