spring:
  application:
    name: k28
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/k28/.env[.properties]
  servlet:
    multipart:
      max-file-size: 1048576B
      max-request-size: 2MB
  flyway:
    locations: classpath:db/migration
    ignore-migration-patterns: "repeatable:missing"
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:vocab_learn}?characterEncoding=UTF-8&connectionTimeZone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  session:
    data:
      redis:
        repository-type: indexed
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    default-encoding: UTF-8
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/api/v1/auth/{registrationId}/callback}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  files:
    max-audio-seconds: ${FILE_MAX_AUDIO_SECONDS:300}
    max-image-dimension: ${FILE_MAX_IMAGE_DIMENSION:4096}
    cleanup:
      enabled: ${FILE_CLEANUP_ENABLED:true}
      initial-delay-ms: ${FILE_CLEANUP_INITIAL_DELAY_MS:60000}
      interval-ms: ${FILE_CLEANUP_INTERVAL_MS:60000}
  jobs:
    enabled: ${JOBS_ENABLED:true}
    interval-ms: ${JOBS_INTERVAL_MS:5000}
    batch-size: 3
    max-retry: 3
    lease: 10m
    backoff-base: 5s
    backoff-max: 5m
  quota:
    zone: ${QUOTA_ZONE:Asia/Ho_Chi_Minh}
  ai:
    provider: ${AI_PROVIDER:fake}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      connect-timeout: 5s
      read-timeout: 60s
      max-output-tokens: 6000
      temperature: 0.2
    fake:
      che-do: ${AI_FAKE_MODE:THANH_CONG}
      do-tre: 1s
    card-draft:
      phien-ban-prompt: card-draft-v1
      max-ky-tu: 5000
      max-the: 50
      max-tep-bytes: 1048576
      max-tu-moi-the: 6
  tts:
    provider: ${TTS_PROVIDER:fake}
    model: ${TTS_MODEL:gpt-4o-mini-tts}
    giong: ${TTS_VOICE:alloy}
    ngon-ngu: en
    phien-ban: tts-v1
    max-ky-tu: 300
    max-bytes: 2097152
    read-timeout: 20s
    fake:
      che-do: ${TTS_FAKE_MODE:THANH_CONG}
      do-tre: 0s
  cookie-secure: ${COOKIE_SECURE:true}
  mail:
    from: ${MAIL_FROM:VocabLearning <no-reply@vocab.local>}
  notebook:
    quen-nhieu: 3
    quen-nhieu-ngay: 30
    chinh-ta-luot: 5
    chinh-ta-sai: 2
    cap-nham: 2
  rewards:
    diem-toi-da-ngay: ${REWARD_DAILY_CAP:100}
    diem-moi-luot-on: 1
    diem-moi-cau-dung: 1
  reminders:
    enabled: ${REMINDERS_ENABLED:true}
    interval-ms: ${REMINDERS_INTERVAL_MS:900000}
    initial-delay-ms: ${REMINDERS_INITIAL_DELAY_MS:60000}
  statistics:
    so-luot-toi-da: 20
    so-quan-sat-toi-thieu: 5
  recommendations:
    toi-da-goi-y: 10
    toi-da-moi-ly-do: 2
    toi-da-the-qua-han: 20
    tien-bo:
      so-ngay-cu: 30
      so-ngay-moi: 7
      so-luot-cu-toi-thieu: 5
      so-sai-cu-toi-thieu: 3
      ty-le-sai-cu-toi-thieu: 0.5
      so-luot-moi-toi-thieu: 5
      so-sai-moi-toi-da: 0
    phat-am-thap:
      enabled: false
      diem-toi-thieu: 60
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket: ${S3_BUCKET:vocab-files}
    region: ${S3_REGION:us-east-1}
    presign-ttl: ${S3_PRESIGN_TTL:10m}

springdoc:
  default-produces-media-type: application/json
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    urls-primary-name: all
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    csrf:
      enabled: true

logging:
  pattern:
    level: "%5p [requestId=%X{requestId}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  servlet:
    session:
      timeout: 7d
  tomcat:
    use-relative-redirects: true
